<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - ERP Center</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="login">
    <h2>Login</h2>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign In</button>
    </form>
    <p>Demo accounts: admin@example.com / admin123</p>
  </main>
</body>
</html>

{% extends "webui/base.html" %}
{% block content %}
  <section>
    <h2>Items</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>SKU</th>
          <th>Name</th>
          <th>Unit</th>
          <th>Stock</th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.sku }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.unit }}</td>
            <td>{{ stocks[item.id] }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="5">No items found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
{% endblock %}
